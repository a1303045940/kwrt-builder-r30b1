name: Build r30b1 DTB

on:
  push:
    paths:
      - '"$GITHUB_WORKSPACE/custom-dts/mt7981b-cmcc-rax3000m.dts'
  workflow_dispatch:

jobs:
  build_dtb:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Clone OpenWrt source
        run: |
          git clone https://github.com/kiddin9/kwrt-openwrt.git
          cd kwrt-openwrt
      
      - name: Replace DTS file
        run: |
          mkdir -p kwrt-openwrt/target/linux/mediatek/dts/
          cp "$GITHUB_WORKSPACE/custom-dts/mt7981b-cmcc-rax3000m.dts" kwrt-openwrt/target/linux/mediatek/dts/mt7981b-cmcc-rax3000m.dts
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler
      
      - name: Compile DTS to DTB
        run: |
          cd kwrt-openwrt/target/linux/mediatek/dts/
          dtc -I dts -O dtb -o mt7981b-cmcc-rax3000m.dtb mt7981b-cmcc-rax3000m.dts
      
      - name: Find and copy DTB to custom-dtb
        run: |
          mkdir -p custom-dtb
          find kwrt-openwrt -name "mt7981b-cmcc-rax3000m.dtb" -type f -exec cp {} custom-dtb/ \;
          ls -la custom-dtb/
      
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add custom-dtb/CS.dtb
          git commit -m "Build DTB from DTS: mt7981b-cmcc-rax3000m [$(date)]" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
