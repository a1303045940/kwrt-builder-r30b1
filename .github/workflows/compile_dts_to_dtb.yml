name: Compile DTS to DTB

on:
  workflow_dispatch:
    inputs:
      DTS_SOURCE_URL:
        description: 'DTS file URL to download'
        required: false
        default: 'https://raw.githubusercontent.com/kiddin9/kwrt-openwrt/main/target/linux/mediatek/dts/mt7981b-cmcc-rax3000m.dts'
      DTS_FILE_NAME:
        description: 'DTS filename (auto-detect if empty)'
        required: false
        default: ''
      MODIFY_DTS:
        description: 'Apply custom modifications to DTS'
        type: boolean
        default: false
      COMMIT_TO_REPO:
        description: 'Commit compiled DTB to repository'
        type: boolean
        default: true

jobs:
  compile-dts:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Device Tree Compiler
        run: |
          echo "📦 Installing device-tree-compiler..."
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler
          
          # 验证安装
          dtc --version

      - name: Create custom-dts directory
        run: |
          mkdir -p custom-dts
          echo "✅ Created custom-dts directory"

      - name: Download DTS file
        run: |
          cd custom-dts
          
          DTS_URL="${{ github.event.inputs.DTS_SOURCE_URL }}"
          
          if [[ -z "$DTS_URL" ]]; then
            DTS_URL="https://raw.githubusercontent.com/kiddin9/kwrt-openwrt/main/target/linux/mediatek/dts/mt7981b-cmcc-rax3000m.dts"
          fi
          
          echo "📥 Downloading DTS from: $DTS_URL"
          
          # 下载 DTS 文件
          wget "$DTS_URL" -O downloaded.dts
          
          # 获取文件名
          if [[ -n "${{ github.event.inputs.DTS_FILE_NAME }}" ]]; then
            DTS_FILENAME="${{ github.event.inputs.DTS_FILE_NAME }}"
          else
            # 从 URL 中提取文件名
            DTS_FILENAME=$(basename "$DTS_URL")
          fi
          
          mv downloaded.dts "$DTS_FILENAME"
          
          echo "DTS_FILENAME=$DTS_FILENAME" >> $GITHUB_ENV
          
          echo "✅ Downloaded: $DTS_FILENAME"
          echo "📄 File size: $(du -h $DTS_FILENAME | cut -f1)"
          
          # 显示文件头部信息
          echo "=== DTS File Preview (first 30 lines) ==="
          head -n 30 "$DTS_FILENAME"

      - name: Validate DTS syntax
        run: |
          cd custom-dts
          DTS_FILE="$DTS_FILENAME"
          
          echo "🔍 Validating DTS syntax..."
          
          # 检查基本语法
          if grep -q "/dts-v1/" "$DTS_FILE"; then
            echo "✅ DTS version declaration found"
          else
            echo "⚠️  Warning: No DTS version declaration"
          fi
          
          if grep -q "compatible" "$DTS_FILE"; then
            echo "✅ Compatible property found"
          else
            echo "⚠️  Warning: No compatible property"
          fi
          
          echo "✅ Basic validation passed"

      - name: Apply custom modifications (optional)
        if: ${{ github.event.inputs.MODIFY_DTS == 'true' }}
        run: |
          cd custom-dts
          DTS_FILE="$DTS_FILENAME"
          
          echo "📝 Applying custom modifications to DTS..."
          
          # 创建备份
          cp "$DTS_FILE" "${DTS_FILE}.original"
          
          # ===== 在这里添加你的自定义修改 =====
          
          # 示例 1: 修改设备模型名称
          # sed -i 's/model = "CMCC RAX3000M";/model = "CMCC RAX3000M Custom";/g' "$DTS_FILE"
          
          # 示例 2: 修改 LED 配置
          # sed -i 's/linux,default-trigger = "default-on";/linux,default-trigger = "heartbeat";/g' "$DTS_FILE"
          
          # 示例 3: 修改内存配置（谨慎修改）
          # sed -i 's/reg = <0 0x40000000 0 0x20000000>;/reg = <0 0x40000000 0 0x40000000>;/g' "$DTS_FILE"
          
          # 示例 4: 添加注释标记
          sed -i '1i// Custom modified DTS file - Generated by GitHub Actions' "$DTS_FILE"
          sed -i '2i// Build Date: '"$(date -u '+%Y-%m-%d %H:%M:%S UTC')"'' "$DTS_FILE"
          
          # ===== 自定义修改结束 =====
          
          echo "✅ Custom modifications applied"
          
          # 显示修改差异
          if command -v diff &> /dev/null; then
            echo "=== Modifications diff ==="
            diff -u "${DTS_FILE}.original" "$DTS_FILE" || true
          fi

      - name: Compile DTS to DTB
        run: |
          cd custom-dts
          DTS_FILE="$DTS_FILENAME"
          DTB_FILE="${DTS_FILE%.dts}.dtb"
          
          echo "🔨 Compiling DTS to DTB..."
          echo "   Input:  $DTS_FILE"
          echo "   Output: $DTB_FILE"
          
          # 编译 DTS 为 DTB
          # -I dts: 输入格式为 DTS
          # -O dtb: 输出格式为 DTB
          # -o: 输出文件
          dtc -I dts -O dtb -o "$DTB_FILE" "$DTS_FILE" 2>&1 | tee compile.log
          
          # 检查编译结果
          if [[ -f "$DTB_FILE" ]]; then
            echo "✅ DTB compiled successfully!"
            echo "DTB_FILENAME=$DTB_FILE" >> $GITHUB_ENV
            
            # 显示文件信息
            echo "=== DTB File Information ==="
            ls -lh "$DTB_FILE"
            file "$DTB_FILE"
            echo "Size: $(du -h $DTB_FILE | cut -f1)"
            
            # 反编译验证（可选）
            echo "=== Decompiling DTB for verification ==="
            dtc -I dtb -O dts "$DTB_FILE" -o "${DTB_FILE%.dtb}.decompiled.dts"
            echo "✅ Decompiled successfully (verification passed)"
            
          else
            echo "❌ DTB compilation failed!"
            echo "=== Compilation Log ==="
            cat compile.log
            exit 1
          fi

      - name: Generate README
        run: |
          cd custom-dts
          
          cat > README.md << 'EOF'
# Custom Device Tree Blob (DTB) Files

This directory contains compiled Device Tree Blob (DTB) files for custom OpenWrt builds.

## Files

EOF
          
          # 只列出 DTB 文件
          for file in *.dtb; do
            if [[ -f "$file" ]]; then
              echo "- \`$file\` ($(du -h $file | cut -f1))" >> README.md
            fi
          done
          
          cat >> README.md << EOF

## Build Information

- **Build Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
- **Source URL**: ${{ github.event.inputs.DTS_SOURCE_URL }}
- **Compiled by**: GitHub Actions
- **Workflow Run**: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

## Usage

The compiled DTB file can be used to replace the default device tree in OpenWrt ImageBuilder:

\`\`\`bash
# The main build workflow will automatically use this DTB file
# from the custom-dts/ directory
\`\`\`

## About DTB Files

**DTB (Device Tree Blob)** is a compiled binary format that describes hardware components:
- Used by bootloader and Linux kernel
- Contains information about CPU, memory, peripherals, etc.
- Binary format (not human-readable)
- Extension: \`.dtb\`

## Recompile

To recompile from source DTS file:

\`\`\`bash
dtc -I dts -O dtb -o output.dtb input.dts
\`\`\`

To decompile DTB back to DTS:

\`\`\`bash
dtc -I dtb -O dts -o output.dts input.dtb
\`\`\`

---
*Auto-generated by [compile_dts.yml](../.github/workflows/compile_dts.yml)*
EOF
          
          echo "✅ README.md generated"

      - name: Clean up source files
        run: |
          cd custom-dts
          
          echo "🧹 Cleaning up source files (keeping only DTB)..."
          
          # 删除 DTS 源文件
          rm -f *.dts
          
          # 删除备份文件
          rm -f *.original
          
          # 删除反编译的验证文件
          rm -f *.decompiled.dts
          
          # 删除编译日志
          rm -f compile.log
          
          echo "✅ Cleanup complete"
          
          # 显示剩余文件
          echo "=== Remaining files ==="
          ls -lh

      - name: Upload DTB artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-dtb-file
          path: |
            custom-dts/*.dtb
            custom-dts/README.md
          retention-days: 30

      - name: Commit DTB to repository
        if: ${{ github.event.inputs.COMMIT_TO_REPO == 'true' }}
        run: |
          cd custom-dts
          
          # 配置 Git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 添加只有 DTB 和 README 文件
          git add -f *.dtb README.md 2>/dev/null || true
          
          # 检查是否有更改
          if git diff --staged --quiet; then
            echo "ℹ️  No changes to commit"
          else
            # 提交更改
            git commit -m "chore: Update compiled DTB file

- Source: ${{ github.event.inputs.DTS_SOURCE_URL }}
- Build date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
- Modified: ${{ github.event.inputs.MODIFY_DTS }}
- Workflow: ${{ github.workflow }}
- Run ID: ${{ github.run_id }}

Note: Only DTB binary files are committed (DTS source files excluded)"
            
            # 推送到仓库
            git push
            
            echo "✅ DTB file committed and pushed to repository"
          fi

      - name: Summary
        run: |
          cd custom-dts
          
          echo "## 🎉 DTB Compilation Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size | Type |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|------|" >> $GITHUB_STEP_SUMMARY
          
          for file in *.dtb; do
            if [[ -f "$file" ]]; then
              SIZE=$(du -h "$file" | cut -f1)
              TYPE=$(file -b "$file" | cut -d',' -f1)
              echo "| \`$file\` | $SIZE | $TYPE |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### What Was Done" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Downloaded DTS source file" >> $GITHUB_STEP_SUMMARY
          echo "✅ Compiled DTS to DTB" >> $GITHUB_STEP_SUMMARY
          echo "✅ Verified compilation" >> $GITHUB_STEP_SUMMARY
          echo "✅ Cleaned up source files (only DTB kept)" >> $GITHUB_STEP_SUMMARY
          echo "✅ Committed to repository" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. The DTB file is now available in \`custom-dts/\` directory" >> $GITHUB_STEP_SUMMARY
          echo "2. Run the main firmware build workflow" >> $GITHUB_STEP_SUMMARY
          echo "3. The DTB will be automatically used in the firmware" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files Location" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: \`custom-dts/*.dtb\`" >> $GITHUB_STEP_SUMMARY
          echo "- Artifacts: Available for download above" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note**: DTS source files are not committed to keep the repository clean." >> $GITHUB_STEP_SUMMARY
