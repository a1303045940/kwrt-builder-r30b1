name: Compile DTS to DTB

on:
  workflow_dispatch:
    inputs:
      DTS_SOURCE_URL:
        description: DTS file URL to download
        required: false
        default: https://raw.githubusercontent.com/kiddin9/kwrt-openwrt/main/target/linux/mediatek/dts/mt7981b-cmcc-rax3000m.dts
      DTS_FILE_NAME:
        description: DTS filename (auto-detect if empty)
        required: false
        default: ""
      MODIFY_DTS:
        description: Apply custom modifications to DTS
        type: boolean
        default: false
      COMMIT_TO_REPO:
        description: Commit compiled DTB to repository
        type: boolean
        default: true

jobs:
  compile-dts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Device Tree Compiler
        run: |
          echo "Installing device-tree-compiler..."
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler
          dtc --version

      - name: Create custom-dts directory
        run: |
          mkdir -p custom-dts
          echo "Created custom-dts directory"

      - name: Download DTS file
        run: |
          cd custom-dts
          DTS_URL="${{ inputs.DTS_SOURCE_URL }}"
          if [ -z "$DTS_URL" ]; then
            DTS_URL="https://raw.githubusercontent.com/kiddin9/kwrt-openwrt/main/target/linux/mediatek/dts/mt7981b-cmcc-rax3000m.dts"
          fi
          echo "Downloading DTS from: $DTS_URL"
          if ! wget "$DTS_URL" -O downloaded.dts; then
            echo "❌ Error: Failed to download DTS file"
            exit 1
          fi
          if [ -n "${{ inputs.DTS_FILE_NAME }}" ]; then
            DTS_FILENAME="${{ inputs.DTS_FILE_NAME }}"
          else
            DTS_FILENAME=$(basename "$DTS_URL")
          fi
          mv downloaded.dts "$DTS_FILENAME"
          echo "DTS_FILENAME=$DTS_FILENAME" >> $GITHUB_ENV
          echo "✅ Downloaded: $DTS_FILENAME"
          ls -lh "$DTS_FILENAME"

      - name: Validate DTS syntax
        run: |
          cd custom-dts
          DTS_FILE="$DTS_FILENAME"
          echo "Validating DTS syntax..."
          if grep -q "/dts-v1/" "$DTS_FILE"; then
            echo "✓ DTS version declaration found"
          fi
          if grep -q "compatible" "$DTS_FILE"; then
            echo "✓ Compatible property found"
          fi
          echo "✅ Basic validation passed"

      - name: Apply custom modifications
        if: ${{ inputs.MODIFY_DTS == true }}
        run: |
          cd custom-dts
          DTS_FILE="$DTS_FILENAME"
          echo "Applying custom modifications to DTS..."
          cp "$DTS_FILE" "${DTS_FILE}.original"
          sed -i '1i// Custom modified DTS - Generated by GitHub Actions' "$DTS_FILE"
          echo "✅ Custom modifications applied"

      - name: Compile DTS to DTB
        run: |
          cd custom-dts
          DTS_FILE="$DTS_FILENAME"
          DTB_FILE="${DTS_FILE%.dts}.dtb"
          echo "Compiling DTS to DTB..."
          echo "Input:  $DTS_FILE"
          echo "Output: $DTB_FILE"
          if dtc -I dts -O dtb -o "$DTB_FILE" "$DTS_FILE" 2>&1 | tee compile.log; then
            if [ -f "$DTB_FILE" ]; then
              echo "✅ DTB compiled successfully!"
              echo "DTB_FILENAME=$DTB_FILE" >> $GITHUB_ENV
              ls -lh "$DTB_FILE"
              file "$DTB_FILE"
              echo "Verifying by decompiling..."
              if dtc -I dtb -O dts "$DTB_FILE" -o "${DTB_FILE%.dtb}.decompiled.dts"; then
                echo "✅ Verification passed"
              else
                echo "⚠️ Decompilation verification failed"
              fi
            else
              echo "❌ DTB file not created"
              cat compile.log
              exit 1
            fi
          else
            echo "❌ DTB compilation failed!"
            cat compile.log
            exit 1
          fi

      - name: Upload compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compilation-log
          path: custom-dts/compile.log
          retention-days: 7

      - name: Generate README
        run: |
          cd custom-dts
          cat > README.md << 'ENDOFREADME'
# Custom Device Tree Blob (DTB) Files

This directory contains compiled DTB files for OpenWrt builds.

## Files
ENDOFREADME
          for file in *.dtb; do
            if [ -f "$file" ]; then
              echo "- \`$file\` ($(du -h $file | cut -f1))" >> README.md
            fi
          done
          cat >> README.md << ENDOFREADME2

## Build Information
- Build Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
- Compiled by: GitHub Actions

## Usage
The DTB file will be automatically used in firmware builds.
ENDOFREADME2
          echo "✅ README.md generated"

      - name: Upload DTB artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-dtb-file
          path: |
            custom-dts/*.dtb
            custom-dts/README.md
          retention-days: 30

      - name: Commit DTB to repository
        if: ${{ inputs.COMMIT_TO_REPO == true }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f custom-dts/*.dtb custom-dts/README.md 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: Update compiled DTB file [skip ci]"
            git push
            echo "✅ DTB file committed and pushed"
          else
            echo "ℹ️ No changes to commit"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## 🎉 DTB Compilation Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Generated Files" >> $GITHUB_STEP_SUMMARY
          if [ -d "custom-dts" ]; then
            cd custom-dts
            for file in *.dtb; do
              if [ -f "$file" ]; then
                echo "- \`$file\` ($(du -h $file | cut -f1))" >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. DTB file is in custom-dts/ directory" >> $GITHUB_STEP_SUMMARY
          echo "2. Run main firmware build workflow" >> $GITHUB_STEP_SUMMARY
