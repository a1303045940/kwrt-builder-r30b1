name: Convert DTS to DTB

on:
  push:
    paths:
      - 'custom-dts/**'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Device Tree Compiler
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler
      
      - name: Convert DTS to DTB
        run: |
          mkdir -p custom-dtb
          for file in custom-dts/*.dts; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .dts)
              dtc -I dts -O dtb "$file" -o "custom-dtb/${filename}.dtb"
            fi
          done
      
      - name: Upload DTB files
        uses: actions/upload-artifact@v4
        with:
          name: dtb-files
          path: custom-dtb/
      
      - name: Commit and Push Changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add custom-dtb/
          git commit -m "Update DTB files from DTS" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
