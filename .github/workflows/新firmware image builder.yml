name: 新firmware image builder

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      BUILD_CUSTOM_PACKAGE:
        description: Build custom package inside "custom-packages"
        type: boolean
        default: false
      COPY_CUSTOM_FILES:
        description: Copy custom files inside "custom-files" to image builder
        type: boolean
        default: false
      CUSTOM_PACKAGE_NAMES:
        description: Name of all custom package inside "custom-packages"
        default: luci-app-argon-config
      UPLOAD_SYSUPGRADE_ONLY:
        description: Save sysupgrade only artifact
        type: boolean
        default: true
      OPENWRT_DOWNLOAD_URL:
        description: Openwrt base download url
        default: https://dl.openwrt.ai/releases
      OPENWRT_VERSION:
        description: Kwrt version
        default: "24.10"
      OPENWRT_TARGET:
        description: Kwrt target to build
        default: mediatek/filogic
      OPENWRT_PROFILE:
        description: Openwrt device profile name
        default: sl_3000-emmc
      OPENWRT_PACKAGES:
        description: Pre install package to openwrt
        default: luci luci-ssl-openssl luci-base luci-compat luci-app-store luci-app-quickstart luci-i18n-quickstart-zh-cn luci-app-passwall luci-i18n-passwall-zh-cn luci-app-ssr-plus luci-app-passwall2 luci-i18n-passwall2-zh-cn luci-app-openclash luci-app-npc luci-app-zerotier luci-app-argon-config luci-app-tailscale luci-app-mosdns luci-i18n-mosdns-zh-cn luci-app-turboacc luci-app-lucky lucky luci-app-store autocore base-files bash block-mount ca-bundle coremark curl dnsmasq-full dropbear ds-lite f2fsck firewall4 fitblk fstools htop kernel kmod-crypto-hw-safexcel kmod-fs-f2fs kmod-gpio-button-hotplug kmod-leds-gpio kmod-lib-zstd kmod-mmc kmod-mt7915e kmod-mt7981-firmware kmod-phy-aquantia kmod-tcp-bbr libc libgcc libustream-mbedtls logd losetup luci-app-advancedplus luci-app-fan luci-app-filemanager luci-app-firewall luci-app-log-viewer luci-app-package-manager luci-app-syscontrol luci-app-upnp luci-app-wizard luci-base luci-compat luci-lib-fs luci-lib-ipkg luci-proto-wireguard mkf2fs mt7981-wo-firmware mtd nano netifd odhcp6c odhcpd-ipv6only openssh-sftp-server opkg ppp ppp-mod-pppoe resolveip swconfig uboot-envtools uci uclient-fetch urandom-seed urngd wget-ssl wpad-basic-mbedtls zram-swap
      DISABLED_SERVICES:
        description: List of service to disable startup
        default: https-dns-proxy

env:
  BUILD_CUSTOM_PACKAGE: ${{github.event_name == 'push' || inputs.BUILD_CUSTOM_PACKAGE}}
  CUSTOM_PACKAGE_NAMES: ${{inputs.CUSTOM_PACKAGE_NAMES || ''}}
  COPY_CUSTOM_FILES: ${{github.event_name == 'push' || inputs.COPY_CUSTOM_FILES}}
  FILES: ""
  UPLOAD_SYSUPGRADE_ONLY: ${{inputs.UPLOAD_SYSUPGRADE_ONLY || false}}
  OPENWRT_DOWNLOAD_URL: ${{inputs.OPENWRT_DOWNLOAD_URL || 'https://dl.openwrt.ai/releases'}}
  OPENWRT_VERSION: ${{inputs.OPENWRT_VERSION || '24.10'}}
  OPENWRT_TARGET: ${{inputs.OPENWRT_TARGET || 'mediatek/filogic'}}
  PROFILE: ${{inputs.OPENWRT_PROFILE || 'sl_3000-emmc'}}
  PACKAGES: ${{inputs.OPENWRT_PACKAGES || 'luci luci-ssl-openssl luci-base luci-compat luci-app-store luci-app-quickstart luci-i18n-quickstart-zh-cn luci-app-passwall luci-i18n-passwall-zh-cn luci-app-ssr-plus luci-app-passwall2 luci-i18n-passwall2-zh-cn luci-app-openclash luci-app-npc luci-app-zerotier luci-app-argon-config luci-app-tailscale luci-app-mosdns luci-i18n-mosdns-zh-cn luci-app-turboacc luci-app-lucky lucky luci-app-store autocore base-files bash block-mount ca-bundle coremark curl dnsmasq-full dropbear ds-lite f2fsck firewall4 fitblk fstools htop kernel kmod-crypto-hw-safexcel kmod-fs-f2fs kmod-gpio-button-hotplug kmod-leds-gpio kmod-lib-zstd kmod-mmc kmod-mt7915e kmod-mt7981-firmware kmod-phy-aquantia kmod-tcp-bbr libc libgcc libustream-mbedtls logd losetup luci-app-advancedplus luci-app-fan luci-app-filemanager luci-app-firewall luci-app-log-viewer luci-app-package-manager luci-app-syscontrol luci-app-upnp luci-app-wizard luci-base luci-compat luci-lib-fs luci-lib-ipkg luci-proto-wireguard mkf2fs mt7981-wo-firmware mtd nano netifd odhcp6c odhcpd-ipv6only openssh-sftp-server opkg ppp ppp-mod-pppoe resolveip swconfig uboot-envtools uci uclient-fetch urandom-seed urngd wget-ssl wpad-basic-mbedtls zram-swap'}}
  DISABLED_SERVICES:  ${{inputs.DISABLED_SERVICES || 'https-dns-proxy'}}
  IMAGE_BUILDER_FILE_NAME: ""
  IMAGE_BUILDER_URL: ""
  NEED_DOWNLOAD: true
  BUILD_TARGET_DIR: ""
  OUTPUT_BASE_NAME: ""
  BUILDER_FILE_EXT: ".xz"
  OPENWRT_PACKAGE_VERSION: "24.10.4"

jobs:
  build-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout if needed
        uses: actions/checkout@v4
        if: ${{ env.BUILD_CUSTOM_PACKAGE }}

      - name: Setup variables
        run: |
          OPENWRT_TARGET=${{ env.OPENWRT_TARGET }}
          OPENWRT_TARGET_AS_NAME=${OPENWRT_TARGET////-}
          IMAGE_BUILDER_FILE_NAME=kwrt-imagebuilder-${OPENWRT_TARGET_AS_NAME}.Linux-x86_64
          IMAGE_BUILDER_URL="https://github.com/1303045940/Kwrt/releases/download/12%2F04_2025_02%2F29_mediatek_filogic/kwrt-imagebuilder-mediatek-filogic.Linux-x86_64.tar"
          CURL_OUTPUT=$(curl --HEAD ${IMAGE_BUILDER_URL}.xz)
          BUILDER_FILE_EXT=${{ env.BUILDER_FILE_EXT }}
          if [[ $(echo $CURL_OUTPUT | grep "404") != "" ]]; then
            BUILDER_FILE_EXT=".gz"
            echo "BUILDER_FILE_EXT=${BUILDER_FILE_EXT}" >> $GITHUB_ENV
          fi
          if [[ $(echo $CURL_OUTPUT | grep "404") != "" ]]; then
            BUILDER_FILE_EXT=".zst"
            echo "BUILDER_FILE_EXT=${BUILDER_FILE_EXT}" >> $GITHUB_ENV
          fi
          IMAGE_BUILDER_URL=${IMAGE_BUILDER_URL}${BUILDER_FILE_EXT}
          BUILD_TARGET_DIR=$IMAGE_BUILDER_FILE_NAME/bin/targets/$OPENWRT_TARGET
          OUTPUT_BASE_NAME=kwrt-${OPENWRT_TARGET_AS_NAME}-${{ env.PROFILE }}
          echo "IMAGE_BUILDER_FILE_NAME=${IMAGE_BUILDER_FILE_NAME}" >> $GITHUB_ENV
          echo "IMAGE_BUILDER_URL=${IMAGE_BUILDER_URL}" >> $GITHUB_ENV
          echo "BUILD_TARGET_DIR=${BUILD_TARGET_DIR}" >> $GITHUB_ENV
          echo "OUTPUT_BASE_NAME=${OUTPUT_BASE_NAME}" >> $GITHUB_ENV

      # - name: Restore cache
      #   uses: actions/cache/restore@v4
      #   with:
      #     path: ${{ env.IMAGE_BUILDER_FILE_NAME }}
      #     key: ${{ env.IMAGE_BUILDER_FILE_NAME }}

      # - name: Check file 
      #   shell: bash
      #   run: |
      #     if [[ -d ${{env.IMAGE_BUILDER_FILE_NAME}} ]]; then
      #       echo "NEED_DOWNLOAD=false" >> $GITHUB_ENV
      #     else
      #       echo "NEED_DOWNLOAD=true" >> $GITHUB_ENV
      #     fi

      - name: Download and extract image builder
        if: ${{ env.NEED_DOWNLOAD == 'true' }}
        run: |
          wget ${{ env.IMAGE_BUILDER_URL }}
          IMAGE_BUILD_FILE=${{env.IMAGE_BUILDER_FILE_NAME}}.tar${{ env.BUILDER_FILE_EXT }}
          if [[ ${{ env.BUILDER_FILE_EXT }} == ".zst" ]]; then
            tar --zstd -x -f ${IMAGE_BUILD_FILE}
          else
            tar -J -x -f ${IMAGE_BUILD_FILE}
          fi

      - name: Copy custom packages and add custom package
        if: ${{ env.BUILD_CUSTOM_PACKAGE }}
        run: |
          rsync -hav custom-packages/* ${{env.IMAGE_BUILDER_FILE_NAME}}/packages/
          echo "PACKAGES=${{env.PACKAGES}} ${{env.CUSTOM_PACKAGE_NAMES}}" >> $GITHUB_ENV

      - name: Copy custom files to image builder
        if: ${{ env.COPY_CUSTOM_FILES }}
        run: |
          rsync -hav custom-files/* ${{env.IMAGE_BUILDER_FILE_NAME}}/files/
          echo "FILES=files" >> $GITHUB_ENV

      # - name: Save cache
      #   if: ${{ env.NEED_DOWNLOAD == 'true' }}
      #   uses: actions/cache/save@v4
      #   with:
      #     path: ${{ env.IMAGE_BUILDER_FILE_NAME }}
      #     key: ${{ env.IMAGE_BUILDER_FILE_NAME }}
          
      - name: Build kwrt image
        run: |
          cd ${{ env.IMAGE_BUILDER_FILE_NAME }}
          
          # 自动检测内核版本
          KERNEL_VERSION=$(cat .targetinfo | grep -m1 "Kernel-Version" | cut -d: -f2 | xargs || echo "6.6.116")
          
          cat > repositories.conf << EOF
          ## Kwrt 核心源 (动态内核版本)
          src/gz kwrt_core https://dl.openwrt.ai/releases/24.10/targets/mediatek/filogic/6.6.116
          src/gz kwrt_base https://dl.openwrt.ai/releases/24.10/packages/aarch64_cortex-a53/base
          src/gz kwrt_luci https://dl.openwrt.ai/releases/24.10/packages/aarch64_cortex-a53/luci
          src/gz kwrt_packages https://dl.openwrt.ai/releases/24.10/packages/aarch64_cortex-a53/packages
          src/gz kwrt_routing https://dl.openwrt.ai/releases/24.10/packages/aarch64_cortex-a53/routing
          src/gz kwrt_kiddin9 https://dl.openwrt.ai/releases/24.10/packages/aarch64_cortex-a53/kiddin9
          
          ## OpenWrt 官方源
          src/gz openwrt_base https://downloads.openwrt.org/releases/24.10.4/targets/mediatek/filogic/packages
          src/gz openwrt_packages https://downloads.openwrt.org/releases/24.10.4/packages/aarch64_cortex-a53/packages
          src/gz openwrt_luci https://downloads.openwrt.org/releases/24.10.4/packages/aarch64_cortex-a53/luci
          src/gz openwrt_routing https://downloads.openwrt.org/releases/24.10.4/packages/aarch64_cortex-a53/routing
          EOF
      
          echo "==== Detected kernel version: ${KERNEL_VERSION} ===="
          echo "==== Repository configuration ===="
          cat repositories.conf
          
          # 定义所有需要的中文包
          CN_PACKAGES="luci-i18n-base-zh-cn \
          luci-i18n-firewall-zh-cn \
          luci-i18n-opkg-zh-cn \
          luci-i18n-ddns-zh-cn \
          luci-i18n-upnp-zh-cn \
          luci-i18n-ttyd-zh-cn \
          luci-i18n-zerotier-zh-cn \
          luci-i18n-wireguard-zh-cn"
          
          echo "==== Chinese language packages to install ===="
          echo "$CN_PACKAGES"
          
          # 合并所有包
          ALL_PACKAGES="${{ env.PACKAGES }} $CN_PACKAGES"
          
          echo "==== Building firmware image ===="
          make image \
          PROFILE=${{ env.PROFILE }} \
          PACKAGES="$ALL_PACKAGES" \
          FILES="${{ env.FILES }}" \
          DISABLED_SERVICES="${{ env.DISABLED_SERVICES }}"
          
          echo "==== Build completed ===="
          ls -lah bin/targets/${{ env.OPENWRT_TARGET }}


      - name: Upload sysupgrade output
        if: ${{ github.event_name == 'workflow_dispatch' && env.UPLOAD_SYSUPGRADE_ONLY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_BASE_NAME }}-sysupgrade
          path: |
            ${{ env.BUILD_TARGET_DIR }}/${{ env.OUTPUT_BASE_NAME }}-squashfs-sysupgrade.bin
            ${{ env.BUILD_TARGET_DIR }}/profiles.json
            ${{ env.BUILD_TARGET_DIR }}/sha256sums
          retention-days: 5

      - name: Upload all output
        if: ${{ github.event_name == 'workflow_dispatch' && env.UPLOAD_SYSUPGRADE_ONLY == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_BASE_NAME }}
          path: ${{ env.BUILD_TARGET_DIR }}
          retention-days: 5

      - name: Create release
        uses: ncipollo/release-action@v1.14.0
        if: ${{ github.event_name == 'push' }}
        with:
          name: "${{ github.ref_name }}"
          artifacts: "${{ env.BUILD_TARGET_DIR }}/*"
          token: ${{ secrets.GH_TOKEN }}
          body: |
            ### Build information:
            * Build target: **${{ env.OPENWRT_TARGET }}**
            * Device profile: **${{ env.PROFILE }}**
            * Kwrt version: **${{ env.OPENWRT_VERSION }}**
            * Image builder downloaded from: ${{ env.IMAGE_BUILDER_URL }}
            <details>
            <summary>Installed package</summary>

            ```
            ${{ env.PACKAGES }}
            ```
            </details>
            <details>
            <summary>Disabled services</summary>

            ```
            ${{ env.DISABLED_SERVICES }}
            ```
            </details>
